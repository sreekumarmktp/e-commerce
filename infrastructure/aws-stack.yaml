AWSTemplateFormatVersion: '2010-09-09'
Description: 'E-commerce App Infrastructure: S3 (Frontend), Elastic Beanstalk (Backend), RDS (Database)'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'production'
    Description: 'Environment name (e.g., dev, prod)'
  DBName:
    Type: String
    Default: 'ecommerce_db'
    Description: 'Database name'
  DBUser:
    Type: String
    Default: 'dbadmin'
    Description: 'Database master username'
  DBPassword:
    Type: String
    NoEcho: true
    Description: 'Database master password'
  InstanceType:
    Type: String
    Default: 't3.micro'
    AllowedValues: ['t2.micro', 't3.micro']
    Description: 'EC2 instance type for EB'
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID for the resources'
  Subnets:
    Type: CommaDelimitedList
    Description: 'Subnets for the Elastic Beanstalk environment'

Resources:
  # --- Network & Security ---
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow DB access from EB and External Clients
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt InstanceSecurityGroup.GroupId
        - IpProtocol: tcp # Allow external access for DBeaver/clients
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds: !Ref Subnets

  # --- Database (RDS) ---
  DBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: !Ref DBName
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: postgres
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !GetAtt DBSecurityGroup.GroupId
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: true
      MultiAZ: false # Keep false for Free Tier

  # --- Backend (Elastic Beanstalk) ---
  EBApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Sub '${EnvironmentName}-api'
      Description: 'E-commerce API Application'

  EBEnvironment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref EBApplication
      EnvironmentName: !Sub '${EnvironmentName}-env'
      PlatformArn: 'arn:aws:elasticbeanstalk:ap-south-2::platform/Node.js 22 running on 64bit Amazon Linux 2023/6.7.4' # Check for latest
      CNAMEPrefix: !Sub '${EnvironmentName}-${AWS::AccountId}'
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: !Ref InstanceType
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref EBInstanceProfile
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: SecurityGroups
          Value: !GetAtt InstanceSecurityGroup.GroupId
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: DATABASE_URL
          Value: !Sub 'postgres://${DBUser}:${DBPassword}@${DBInstance.Endpoint.Address}:5432/${DBName}'
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: API_BASE_URL
          Value: !Sub 'http://${EnvironmentName}-${AWS::AccountId}.${AWS::Region}.elasticbeanstalk.com'
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: PORT
          Value: '8080'
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: SingleInstance # Free Tier
        - Namespace: aws:ec2:vpc
          OptionName: VPCId
          Value: !Ref VpcId
        - Namespace: aws:ec2:vpc
          OptionName: Subnets
          Value: !Join [",", !Ref Subnets]
        - Namespace: aws:ec2:vpc
          OptionName: ELBSubnets
          Value: !Join [",", !Ref Subnets]

  # --- IAM Roles for EB ---
  EBInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkMulticontainerDocker
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier

  EBInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EBInstanceRole

  # --- IAM Role for Lambda ---
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3BucketCleanupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !Sub 'arn:aws:s3:::${EnvironmentName}-ui-${AWS::AccountId}'
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub 'arn:aws:s3:::${EnvironmentName}-ui-${AWS::AccountId}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'

  # --- Lambda Function for S3 Bucket Cleanup ---
  EmptyS3BucketFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-empty-s3-bucket'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import logging
          import urllib3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Initialize HTTP client for sending CloudFormation responses
          http = urllib3.PoolManager()

          def send_response(event, context, response_status, response_data=None, physical_resource_id=None, reason=None):
              """
              Send response to CloudFormation custom resource.
              """
              response_data = response_data or {}
              physical_resource_id = physical_resource_id or context.log_stream_name
              reason = reason or f'See CloudWatch Log Stream: {context.log_stream_name}'

              response_body = {
                  'Status': response_status,
                  'Reason': reason,
                  'PhysicalResourceId': physical_resource_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': response_data
              }

              json_response = json.dumps(response_body)
              logger.info(f'Response body: {json_response}')

              headers = {
                  'content-type': '',
                  'content-length': str(len(json_response))
              }

              try:
                  response = http.request(
                      'PUT',
                      event['ResponseURL'],
                      body=json_response,
                      headers=headers
                  )
                  logger.info(f'CloudFormation response status: {response.status}')
              except Exception as e:
                  logger.error(f'Failed to send response to CloudFormation: {str(e)}')

          def handler(event, context):
              """
              Empty S3 bucket on CloudFormation stack deletion.
              
              Event types:
              - Create: No action (return success)
              - Update: No action (return success)
              - Delete: Empty the bucket
              """
              logger.info(f'Received event: {json.dumps(event)}')
              
              try:
                  bucket_name = event['ResourceProperties']['BucketName']
                  request_type = event['RequestType']
                  
                  logger.info(f'Request type: {request_type}, Bucket: {bucket_name}')
                  
                  if request_type == 'Delete':
                      logger.info(f'Emptying bucket: {bucket_name}')
                      s3 = boto3.resource('s3')
                      bucket = s3.Bucket(bucket_name)
                      
                      # Delete all object versions and delete markers
                      bucket.object_versions.all().delete()
                      
                      logger.info(f'Successfully emptied bucket: {bucket_name}')
                  else:
                      logger.info(f'No action required for {request_type} event')
                  
                  send_response(event, context, 'SUCCESS')
                  
              except Exception as e:
                  logger.error(f'Error: {str(e)}', exc_info=True)
                  send_response(event, context, 'FAILED', reason=str(e))

  # --- Frontend (S3) ---
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-ui-${AWS::AccountId}' # Unique bucket name
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # --- Custom Resource to Empty S3 Bucket on Deletion ---
  EmptyS3BucketResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: FrontendBucket
    Properties:
      ServiceToken: !GetAtt EmptyS3BucketFunction.Arn
      BucketName: !Ref FrontendBucket

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${FrontendBucket}/*'

Outputs:
  APIEndpoint:
    Description: URL of the API
    Value: !Sub 'http://${EnvironmentName}-${AWS::AccountId}.${AWS::Region}.elasticbeanstalk.com'
  FrontendBucketName:
    Description: Name of the S3 Bucket for Frontend
    Value: !Ref FrontendBucket
  UIEndpoint:
    Description: URL of the Frontend website
    Value: !GetAtt FrontendBucket.WebsiteURL
  DBEndpoint:
    Description: RDS Endpoint
    Value: !GetAtt DBInstance.Endpoint.Address
